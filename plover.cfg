# Seed configuration for `nix run` (portable mode). Plover rewrites this file
# as you change settings in the GUI; it is only copied in when missing.
#
# KaraS strokes are the standard English Stenotype keys, and the dictionary
# emits romaji (`{^ka^}`), so a Japanese IME in romaji mode does the kana
# conversion.

[Machine Configuration]
machine_type = Keyboard
auto_start = True

[System]
name = English Stenotype

[System: English Stenotype]
dictionaries = [{"enabled": true, "path": "user.json"}, {"enabled": true, "path": "karas_main.json"}]
